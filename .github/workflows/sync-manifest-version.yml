name: Sync Manifest Version & Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "New version number (e.g. 2.1.2 or v2.1.2)"
        required: true
        type: string
      release_title:
        description: "Optional GitHub Release title (defaults to v<version>)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  sync-and-release:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest
    steps:
      - name: Determine target version and release behavior
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TITLE: ${{ inputs.release_title }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          event = os.environ["EVENT_NAME"]
          semver_re = re.compile(r"(?:^|[^0-9A-Za-z.])v?(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)(?:$|[^0-9A-Za-z.])")

          version = None
          create_release = "false"
          release_title = ""

          if event == "workflow_dispatch":
              raw = os.environ["INPUT_VERSION"].strip().lstrip("v")
              if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", raw):
                  print(f"Invalid version input: {os.environ['INPUT_VERSION']}", file=sys.stderr)
                  sys.exit(1)
              version = raw
              create_release = "true"
              release_title = os.environ["INPUT_TITLE"].strip() or f"v{version}"
          elif event == "pull_request":
              pr_title = os.environ.get("PR_TITLE", "")
              pr_body = os.environ.get("PR_BODY", "")
              # Look for explicit "version: X.Y.Z" in PR body first, then semver in PR title
              body_match = re.search(r"(?im)^\s*version\s*:\s*v?(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)\s*$", pr_body)
              title_match = semver_re.search(pr_title)
              if body_match:
                  version = body_match.group(1)
              elif title_match:
                  version = title_match.group(1)

              if version:
                  create_release = "true"
                  release_title = f"v{version}"
              else:
                  print("No version number found in PR title or body ('version: X.Y.Z'); skipping release.")
          elif event == "push":
              raw = os.environ["REF_NAME"].strip().lstrip("v")
              if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", raw):
                  print(f"Tag '{os.environ['REF_NAME']}' does not match vX.Y.Z semver format.", file=sys.stderr)
                  sys.exit(1)
              version = raw
              create_release = "false"
              release_title = f"v{version}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_run={'true' if version else 'false'}\n")
              if version:
                  out.write(f"version={version}\n")
                  out.write(f"tag=v{version}\n")
                  out.write(f"create_release={create_release}\n")
                  out.write(f"release_title={release_title}\n")
          PY

      - name: Checkout main
        if: steps.meta.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git user
        if: steps.meta.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update manifest.json on main and update tag
        if: steps.meta.outputs.should_run == 'true'
        env:
          TARGET_VERSION: ${{ steps.meta.outputs.version }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          MANIFEST_PATH="custom_components/system_1_2_dual_ai/manifest.json"
          UPDATED=$(python3 -c '
          import json, os, pathlib
          p = pathlib.Path("custom_components/system_1_2_dual_ai/manifest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          target = os.environ["TARGET_VERSION"]
          if data.get("version") != target:
              data["version"] = target
              p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
              print("changed")
          else:
              print("unchanged")
          ')

          if [ "$UPDATED" = "changed" ]; then
            git add "$MANIFEST_PATH"
            git commit -m "chore: bump manifest version to $TARGET_VERSION"
            git push origin HEAD:main
          else
            echo "manifest.json on main already matches $TARGET_VERSION"
          fi

          git tag -f "$TAG_NAME"
          git push -f origin "refs/tags/$TAG_NAME"

      - name: Create GitHub Release
        if: steps.meta.outputs.should_run == 'true' && steps.meta.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.release_title }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE"
          else
            gh release create "$TAG_NAME" --title "$RELEASE_TITLE" --generate-notes
          fi

      - name: Sync manifest.json to dev branch
        if: steps.meta.outputs.should_run == 'true'
        env:
          TARGET_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            git checkout -B dev origin/dev
            UPDATED=$(python3 -c '
            import json, os, pathlib
            p = pathlib.Path("custom_components/system_1_2_dual_ai/manifest.json")
            data = json.loads(p.read_text(encoding="utf-8"))
            target = os.environ["TARGET_VERSION"]
            if data.get("version") != target:
                data["version"] = target
                p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
                print("changed")
            else:
                print("unchanged")
            ')
            if [ "$UPDATED" = "changed" ]; then
              git add custom_components/system_1_2_dual_ai/manifest.json
              git commit -m "chore: sync manifest version to $TARGET_VERSION"
              git push origin HEAD:dev
            else
              echo "manifest.json on dev already matches $TARGET_VERSION"
            fi
          else
            echo "origin/dev branch not found; skipping dev sync."
          fi
