name: Sync Manifest Version

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Extract and validate version from tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG_NAME' does not match vX.Y.Z semver format."
            exit 1
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update manifest.json on main and move tag
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          MANIFEST_PATH="custom_components/system_1_2_dual_ai/manifest.json"
          UPDATED=$(python3 -c '
          import json, os, pathlib
          p = pathlib.Path("custom_components/system_1_2_dual_ai/manifest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          target = os.environ["TARGET_VERSION"]
          if data.get("version") != target:
              data["version"] = target
              p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
              print("changed")
          else:
              print("unchanged")
          ')

          if [ "$UPDATED" = "changed" ]; then
            git add "$MANIFEST_PATH"
            git commit -m "chore: bump manifest version to $TARGET_VERSION"
            git push origin HEAD:main
            git tag -f "$TAG_NAME"
            git push -f origin "refs/tags/$TAG_NAME"
          else
            echo "manifest.json on main already matches $TARGET_VERSION"
          fi

      - name: Sync manifest.json to dev branch
        env:
          TARGET_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            git checkout -B dev origin/dev
            UPDATED=$(python3 -c '
            import json, os, pathlib
            p = pathlib.Path("custom_components/system_1_2_dual_ai/manifest.json")
            data = json.loads(p.read_text(encoding="utf-8"))
            target = os.environ["TARGET_VERSION"]
            if data.get("version") != target:
                data["version"] = target
                p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
                print("changed")
            else:
                print("unchanged")
            ')
            if [ "$UPDATED" = "changed" ]; then
              git add custom_components/system_1_2_dual_ai/manifest.json
              git commit -m "chore: sync manifest version to $TARGET_VERSION"
              git push origin HEAD:dev
            else
              echo "manifest.json on dev already matches $TARGET_VERSION"
            fi
          else
            echo "origin/dev branch not found; skipping dev sync."
          fi
